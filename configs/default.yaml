# Single source of truth for the whole pipeline.  All paths are relative to the repo root.
paths:
  raw_csv: data/raw/drug_excipient_data.csv
  processed_dir: data/processed
  results_dir: results

seeds: [0, 1, 2, 3, 4]          # five seeds → mean ± std in E3/E4; E1/E2 use first three

features:
  chunk_size: 100               # molecules per PaDEL call (resume granularity)
  padel_timeout: 900            # seconds per chunk

split:
  train: 0.70
  val: 0.15
  test: 0.15
  min_pos_eval: 8               # val/test must contain >= this many incompatible pairs
  min_pos_eval_cold_both: 4
  cold_both_probs: [0.6, 0.2, 0.2]
  max_attempts: 500
  leakage_unit: chem            # cid | chem (default, chemistry-only) | struct (legacy+fp) | parent
  # chem: merges identical SMILES / stereo-stripped SMILES / InChIKey connectivity only.
  # Fingerprint collisions are NEVER merged (reported separately in E5).
  # Legacy 'structure' renamed to 'struct' in code; struct_group column in structure_groups.csv.

# ── Paper-faithful protocol (Patel et al. 2023, Sec. 2.2) ──
paper_protocol:
  hidden: [1024, 1024, 1024]
  head: softmax2                # 2 softmax outputs, BCE on one-hot
  optimizer: rmsprop
  lr: 0.001
  batch_size: 150
  epochs: 200
  oversample_factor: 1          # E1: raw CSV already contains replicated rows
  oversample_factor_clean: 4    # E2: replicate incompatible x4 (paper: "four times")
  threshold: 0.5
  checkpoints: [val_accuracy, val_loss, val_precision]

# ── Unified protocol (every model in E3/E4/E5) ──
unified_protocol:
  head: logit1
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  epochs: 100
  patience: 15
  checkpoint: val_pr_auc
  pos_weight: auto              # n_neg/n_pos from training partition only
  threshold: tuned_val_f1       # threshold maximising incompatible F1 on validation

# ── GNN protocol (larger batches hurt due to cross-attention O(N^2); use token budget) ──
gnn_protocol:
  head: logit1
  optimizer: adamw
  lr: 0.0005
  weight_decay: 0.0001
  batch_size: 32                # pairs per GPU batch (tune down if OOM)
  val_batch_size: 32
  epochs: 80
  patience: 15
  checkpoint: val_pr_auc
  pos_weight: auto
  threshold: tuned_val_f1
  max_grad_norm: 1.0
  mixed_precision: true         # AMP; falls back to fp32 on CPU

models:
  concat_mlp:
    hidden: [1024, 1024, 1024]
    dropout: 0.0
  concat_mlp_reg:
    hidden: [1024, 1024, 1024]
    dropout: 0.3
  siamese:
    encoder: [512, 256]
    head: [128]
    dropout: 0.3
    interaction: full
  siamese_sum:
    encoder: [512, 256]
    head: [128]
    dropout: 0.3
    interaction: sum
  rf:
    n_estimators: 300
  entity_prior:
    smoothing: 2.0

  # ── Graph models ──────────────────────────────────────────────────────────
  de_crossnet:
    d_h: 256                    # GINE hidden dim / cross-attn dim
    n_layers: 4                 # GINE message-passing layers
    n_heads: 4                  # cross-attention heads
    d_fp_out: 128               # fingerprint branch output dim
    n_cross: 2                  # bidirectional cross-attention layers
    dropout: 0.15
    head_hidden: [256, 128]
    # Estimated ~0.9 M parameters

  gnn_siamese:
    d_h: 256
    n_layers: 4
    dropout: 0.15
    head_hidden: [256, 128]
    # Estimated ~0.6 M parameters

  # ── Ablation variants of DE-CrossNet ──────────────────────────────────────
  de_crossnet_no_fp:            # graph only (no fingerprint branch)
    d_h: 256
    n_layers: 4
    n_heads: 4
    d_fp_out: 0                 # 0 means no FP branch (handled in gnn.py)
    n_cross: 2
    dropout: 0.15
    head_hidden: [256, 128]

  de_crossnet_self_attn:        # self-attention instead of cross-attention (capacity-matched)
    d_h: 256
    n_layers: 4
    n_heads: 4
    d_fp_out: 128
    n_cross: 0                  # 0 cross-attn layers; model adds same-size self-attn instead
    dropout: 0.15
    head_hidden: [256, 128]

experiments:
  E0_benchmark:
    split: random_pair
    models: [de_crossnet, gnn_siamese, siamese, concat_mlp, rf, entity_prior]
    protocol: unified
    seeds: 1
    # Purpose: measure actual GPU time/memory before committing to full E3/E4

  E1_reproduction:
    split: paper_rows
    models: [paper_ann]
    protocol: paper
    seeds: 3
    # Paper-faithful leaky protocol (row-level, NOT pair-level); reproduce paper numbers

  E2_leakage_audit:
    split: random_pair
    models: [paper_ann]
    protocol: paper_clean
    seeds: 3
    # Same ANN, clean pair-level split, oversampling; quantifies duplicate leakage

  E3_generalization:
    splits: [random_pair, cold_drug, cold_excipient, cold_both]
    models: [de_crossnet, gnn_siamese, siamese, concat_mlp, rf, entity_prior]
    protocol: unified
    seeds: 5
    # Main comparison: all models, all split types, unified training

  E4_ablation:
    splits: [random_pair, cold_drug, cold_excipient]
    models: [siamese_sum, concat_mlp_reg, de_crossnet_no_fp, de_crossnet_self_attn]
    protocol: unified
    seeds: 5
    # Component ablations: interaction terms, regularisation, FP branch, cross-attn vs self-attn

  E5_sensitivity:
    splits: [random_pair, cold_drug, cold_excipient]
    models: [de_crossnet, siamese]
    protocol: unified
    seeds: 3
    # Sensitivity to leakage unit (chem vs struct vs parent) + FP-collision analysis
    leakage_units: [chem, struct, parent]   # runner script iterates over these

  E6_attention:
    split: cold_drug
    models: [de_crossnet]
    protocol: unified
    seeds: 1
    # Attention case studies (visualise atom-pair attention for selected drug-excipient pairs)

plots:
  dpi: 600
  per_run_plot_seeds: [0]       # per-run PNGs only for these seeds
  checkpoint_seeds: [0]         # .pt checkpoints only for these seeds
